name: Sync from Etsy and publish website

on:
  schedule:
    - cron: "17 * * * *"   # every hour: new Etsy listings and admin changes go live within the hour
    - cron: "2 19 * * *"   # just after midnight in India, when the daily Etsy sale changes
  workflow_dispatch:          # "Run workflow" button for an instant update
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read listings from Etsy (read only)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: python sync_etsy.py
      - name: Read admin panel content
        run: python fetch_admin.py
      - name: Save new images and photo measurements into the repo
        run: |
          python fetch_images.py
          python looks.py
          # GitHub switches off hourly runs after 60 days without a commit, so leave a small heartbeat once a month
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25 * 86400 )) ]; then date -u +"%Y-%m-%d %H:%M UTC" > content/heartbeat.txt; fi
          if [ -n "$(git status --porcelain static content/look_crops.json content/heartbeat.txt content/slug_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static content/look_crops.json content/heartbeat.txt content/slug_history.json 2>/dev/null || git add static content/look_crops.json
            git commit -m "Save generated images, photo measurements and monthly heartbeat [skip ci]"
            git push || echo "push skipped"
          fi
      - name: Build website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build.py
      - name: Remember old pattern addresses (so renamed listings keep their old links working)
        run: |
          if [ -n "$(git status --porcelain content/slug_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/slug_history.json
            git commit -m "Remember pattern addresses [skip ci]"
            git pull --rebase -q || true
            git push || echo "push skipped"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: pinterest-pins
          path: dist/tools/pinterest-pins.csv
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
