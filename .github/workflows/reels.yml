name: Post Reels to Instagram and Facebook

on:
  schedule:
    - cron: "23 16 * * *"  # every day ~10 pm India time (off the busy :00 minute so GitHub starts it on time)
    - cron: "41 0 * * *"   # ~6:10 am India time (evening in New York): occasional Claude-made reels from extra.json
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test video links and connection, post = post now"
        type: choice
        options: [check, post, extra]
        default: check
      date:
        description: "Post the reel planned for this date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post today's reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          POST_DATE: ${{ inputs.date }}
          POST_TO_FACEBOOK: "yes"
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$SCHED" = "41 0 * * *" ] || [ "$MODE" = "extra" ]; then python social/reels/post_reels.py --extra; exit $?; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "check" ]; then
            python social/reels/post_reels.py --check
          else
            python social/reels/post_reels.py --date "$POST_DATE"
          fi
      - name: Remember what was posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain social/instagram/posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add social/instagram/posted.json
            git commit -m "Reels: remember posted [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs -q && git push && exit 0
              echo "push failed, retry $i"; sleep $((i*5))
            done
            echo "::error::Could not save posted.json"; exit 1
          fi
