{# Brand film. Needs `st` (studio.data()) and `u`. Important content stays inside x 250..950 so phones can crop to a square. #}
<div class="film" data-film data-loop>
  <div class="film-screen">
    <svg class="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="film-title" aria-describedby="film-text">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="rgba(26,23,23,0.10)"/></pattern>
        <pattern id="matgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/></pattern>
        <pattern id="wood" width="240" height="40" patternUnits="userSpaceOnUse"><rect width="240" height="40" fill="#E6D2B5"/><path d="M0 12 C60 6 120 18 240 10 M0 30 C80 26 150 36 240 28" fill="none" stroke="#D8C09E" stroke-width="2"/></pattern>
        <pattern id="fab-linen" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#D9CBB2"/><path d="M0 1.5h6M0 4.5h6" stroke="#CDBC9E" stroke-width=".8"/><path d="M1.5 0v6M4.5 0v6" stroke="#E4D8C3" stroke-width=".8"/></pattern>
        <pattern id="fab-gingham" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#fff"/><rect width="9" height="18" fill="rgba(138,40,34,0.28)"/><rect width="18" height="9" fill="rgba(138,40,34,0.28)"/></pattern>
        <pattern id="fab-floral" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#F7DDE3"/>
          <g transform="translate(9 9)"><circle r="3.4" cx="0" cy="-4" fill="#D9688A"/><circle r="3.4" cx="4" cy="0" fill="#D9688A"/><circle r="3.4" cx="0" cy="4" fill="#D9688A"/><circle r="3.4" cx="-4" cy="0" fill="#D9688A"/><circle r="2" fill="#F5D76E"/></g>
          <g transform="translate(26 25)"><circle r="2.6" cx="0" cy="-3" fill="#8A2822"/><circle r="2.6" cx="3" cy="0" fill="#8A2822"/><circle r="2.6" cx="0" cy="3" fill="#8A2822"/><circle r="2.6" cx="-3" cy="0" fill="#8A2822"/><circle r="1.5" fill="#fff"/></g>
          <ellipse cx="22" cy="10" rx="4" ry="1.8" fill="#7FA77A" transform="rotate(-30 22 10)"/><ellipse cx="11" cy="27" rx="4" ry="1.8" fill="#7FA77A" transform="rotate(25 11 27)"/></pattern>
        <pattern id="fab-denim" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#5B7C9C"/><path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#7898B6" stroke-width="1.4"/></pattern>
        <pattern id="fab-sage" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#A9C3A6"/><path d="M0 3h6" stroke="#9DB79A" stroke-width="1"/></pattern>
        <pattern id="fab-dots" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#1A1717"/><circle cx="4" cy="4" r="1.7" fill="#fff"/><circle cx="11" cy="11" r="1.7" fill="#fff"/></pattern>
        <clipPath id="sewclip"><rect x="-200" y="0" width="605" height="700"/></clipPath>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A1717" flood-opacity=".18"/></filter>
      </defs>

      {# 1. sketchbook #}
      <g class="scene" data-scene="0">
        <rect width="1200" height="700" fill="#FCF1C9"/><rect width="1200" height="700" fill="url(#dots)"/>
        {% for s in st.swatches %}
        <g transform="rotate({{ s.r }} {{ s.x + 56 }} {{ s.y + 56 }})"><g class="pop" style="--d: {{ 0.2 + loop.index0 * 0.18 }}s">
          <path d="{{ s.d }}" fill="url(#{{ s.fab }})" filter="url(#soft)"/>
          <path d="M{{ s.x + 56 }} {{ s.y + 6 }} l18 -22" class="pin-l"/><circle cx="{{ s.x + 74 }}" cy="{{ s.y - 16 }}" r="7" class="pin-h{{ loop.index0 % 3 }}"/>
        </g></g>
        {% endfor %}
        <rect x="372" y="80" width="476" height="572" rx="16" fill="rgba(26,23,23,0.10)"/>
        <rect x="362" y="70" width="476" height="572" rx="16" class="book"/>
        {% for x in range(392, 820, 30) %}<ellipse cx="{{ x }}" cy="70" rx="6" ry="15" class="ring"/>{% endfor %}
        {% set k = st.sketch %}
        <path class="ln draw" pathLength="1" d="{{ k.outline }}" style="--d: 0.5s; --t: 3.2s"/>
        <path class="ln thin draw" pathLength="1" d="{{ k.neck }}" style="--d: 3.8s; --t: 0.6s"/>
        {% for d in k.pockets %}<path class="ln thin dash pop" d="{{ d }}" style="--d: {{ 4.2 + loop.index0 * 0.2 }}s"/>{% endfor %}
        <g class="pencil">
          <path d="M0 0 L7 -18 L18 -7 Z" fill="#E9C99A" stroke="#1A1717" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 0 L2.5 -6.5 L6.5 -2.5 Z" fill="#1A1717"/>
          <path d="M7 -18 L18 -7 L84 -73 L73 -84 Z" fill="#F5D76E" stroke="#1A1717" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M73 -84 L84 -73 L92 -81 L81 -92 Z" fill="#B8B2C6" stroke="#1A1717" stroke-width="1.5"/><path d="M81 -92 L92 -81 L100 -89 Q96 -97 89 -100 Z" fill="#D9688A" stroke="#1A1717" stroke-width="1.5"/>
          <animateMotion begin="indefinite" dur="3.2s" fill="freeze" path="{{ k.outline }}" data-smil data-at="0.5"/>
        </g>
        <g class="pop" style="--d: 4.6s"><path d="M664 156 q14 -18 30 -22" class="note-l"/><text class="note" x="698" y="140">boat neck</text></g>
        <g class="pop" style="--d: 5s"><path d="M760 470 q34 10 46 40" class="note-l"/><text class="note" x="740" y="560" text-anchor="middle">pockets!</text></g>
        <text class="brand-txt pop" x="600" y="618" text-anchor="middle" style="--d: 5.4s">PATTERNS BY RISH</text>
      </g>

      {# 2. drafting and grading #}
      <g class="scene" data-scene="1">
        <rect width="1200" height="700" fill="#E3F2EA"/><rect width="1200" height="700" fill="url(#dots)"/>
        <rect x="290" y="58" width="360" height="520" rx="6" fill="#fff" filter="url(#soft)"/>
        {% set g = st.grade %}
        <path class="fold" d="{{ g.fold }}"/>
        {% for l in g.lines %}<path class="size-ln draw" pathLength="1" d="{{ l.d }}" style="--c: {{ l.color }}; --d: {{ 0.3 + l.i * 0.3 }}s; --t: 1.3s"/>{% endfor %}
        <text class="piece-name" x="372" y="420">FRONT</text>
        <text class="note" x="700" y="98">one pattern, every size</text>
        {% for l in g.lines %}
        <g class="pop" style="--d: {{ 0.6 + l.i * 0.3 }}s">
          <rect x="{{ 700 + (l.i % 3) * 82 }}" y="{{ 130 + (l.i // 3) * 64 }}" width="70" height="44" rx="22" class="chip-r" style="--c: {{ l.color }}"/>
          <text x="{{ 735 + (l.i % 3) * 82 }}" y="{{ 159 + (l.i // 3) * 64 }}" text-anchor="middle" class="chip-t">{{ l.size }}</text>
        </g>
        {% endfor %}
        <g class="tape-unroll" style="--d: 0.4s">
          <rect x="300" y="604" width="650" height="44" rx="4" class="tape-r"/>
          {% for i in range(0, 64) %}<path d="M{{ 312 + i * 10 }} 604 v{{ 18 if i % 10 == 0 else (12 if i % 5 == 0 else 7) }}" class="tape-t"/>{% endfor %}
          {% for n in range(0, 7) %}<text x="{{ 312 + n * 100 }}" y="640" text-anchor="middle" class="tape-n">{{ n * 10 }}</text>{% endfor %}
        </g>
        <circle cx="290" cy="626" r="38" class="tape-case"/><circle cx="290" cy="626" r="14" class="tape-hub"/>
      </g>

      {# 3. printing and taping #}
      <g class="scene" data-scene="2">
        <rect width="1200" height="700" fill="#E0ECFA"/><rect width="1200" height="700" fill="url(#dots)"/>
        <text class="note" x="600" y="120" text-anchor="middle">A4 or US Letter pages</text>
        {% set t = st.tiles %}
        {% for p in t.pages %}
        <g class="drop" style="--d: {{ 0.15 + p.i * 0.06 }}s">
          <rect x="{{ p.x + 2 }}" y="{{ p.y + 2 }}" width="{{ p.w - 4 }}" height="{{ p.h - 4 }}" class="page-r"/>
          <text x="{{ p.x + p.w / 2 }}" y="{{ p.y + p.h / 2 + 5 }}" text-anchor="middle" class="page-n">{{ p.label }}</text>
        </g>
        {% endfor %}
        {% for d in t.pieces %}<path class="ln draw" pathLength="1" d="{{ d }}" style="--d: {{ 2.3 + loop.index0 * 0.35 }}s; --t: 1.6s"/>{% endfor %}
        {% for tp in t.tapes %}<rect class="tape-bit pop" x="{{ tp.x }}" y="{{ tp.y }}" width="14" height="24" rx="2" style="--d: {{ 4.3 + loop.index0 * 0.08 }}s"/>{% endfor %}
        <text class="note pop" x="600" y="648" text-anchor="middle" style="--d: 4.8s">tape them together</text>
      </g>

      {# 4. cutting #}
      <g class="scene" data-scene="3">
        <rect width="1200" height="700" fill="#2F6656"/><rect width="1200" height="700" fill="url(#matgrid)"/>
        <path class="fabric-big" d="M280 66 L920 66 L920 650 L280 650 Z" fill="url(#fab-floral)" filter="url(#soft)"/>
        <g class="lift" style="--d: 6s">
          <path d="{{ st.cut }}" class="paper-piece"/>
          <path d="{{ st.cut }}" class="cut-dash"/>
          <mask id="cutmask"><path class="draw" pathLength="1" d="{{ st.cut }}" stroke="#fff" stroke-width="18" fill="none" style="--d: 0.6s; --t: 5.2s"/></mask>
          <path d="{{ st.cut }}" class="cut-done" mask="url(#cutmask)"/>
          <text class="paper-label" x="560" y="360" text-anchor="middle">FRONT</text>
          {% for x, y, c in [(520, 170, 0), (610, 170, 1), (560, 300, 2), (470, 520, 0), (660, 520, 1)] %}<circle cx="{{ x }}" cy="{{ y }}" r="7" class="pin-h{{ c }}"/>{% endfor %}
        </g>
        <g class="scissor-mover">
          <g transform="scale(1.25)">
          <g class="blade-a"><path class="sc-blade" d="M-42 -3 C-12 -9 12 -6 34 -1 L34 1.5 C10 1 -18 3 -42 4 Z"/><path class="sc-shank" d="M-40 4 Q-56 12 -66 16"/><ellipse class="sc-ring" cx="-82" cy="20" rx="17" ry="12"/>
            <animateTransform attributeName="transform" type="rotate" values="-13 -38 0;1 -38 0;-13 -38 0" dur=".4s" repeatCount="13" begin="indefinite" data-smil data-at="0.6"/></g>
          <g class="blade-b"><path class="sc-blade" d="M-42 3 C-12 9 12 6 34 1 L34 -1.5 C10 -1 -18 -3 -42 -4 Z"/><path class="sc-shank" d="M-40 -4 Q-56 -12 -66 -16"/><ellipse class="sc-ring" cx="-82" cy="-20" rx="17" ry="12"/>
            <animateTransform attributeName="transform" type="rotate" values="13 -38 0;-1 -38 0;13 -38 0" dur=".4s" repeatCount="13" begin="indefinite" data-smil data-at="0.6"/></g>
          <circle class="sc-pivot" cx="-38" cy="0" r="4.5"/>
          </g>
          <animateMotion begin="indefinite" dur="5.2s" fill="freeze" rotate="auto" path="{{ st.cut }}" data-smil data-at="0.6"/>
        </g>
        <text class="note light pop" x="600" y="686" text-anchor="middle" style="--d: 6.2s">pin, then cut</text>
      </g>

      {# 5. sewing machine #}
      <g class="scene" data-scene="4">
        <rect width="1200" height="700" fill="#FBE2E8"/><rect width="1200" height="700" fill="url(#dots)"/>
        <rect y="540" width="1200" height="160" fill="url(#wood)"/>
        <rect x="300" y="470" width="610" height="74" rx="16" class="mach"/>
        <path d="M760 470 L760 240 Q760 176 824 176 L860 176 Q900 176 900 236 L900 470 Z" class="mach"/>
        <rect x="350" y="168" width="550" height="84" rx="42" class="mach"/>
        <rect x="340" y="168" width="140" height="236" rx="34" class="mach"/>
        <circle cx="830" cy="330" r="16" class="dial"/><circle cx="830" cy="390" r="10" class="dial"/>
        <image href="{{ u('static/logo-mark.svg') }}" x="512" y="186" width="62" height="52"/>
        <text x="588" y="222" class="mach-brand">PATTERNS BY RISH</text>
        <g class="wheel"><circle cx="918" cy="262" r="46" class="mach"/><path d="M918 222 V302 M878 262 H958 M890 234 L946 290 M946 234 L890 290" class="spoke"/><circle cx="918" cy="262" r="10" class="dial"/></g>
        <path d="M640 168 V118" class="spool-pin"/>
        <g class="spool"><rect x="616" y="96" width="48" height="10" rx="3" class="spool-cap"/><rect x="620" y="106" width="40" height="44" class="spool-thread"/><path d="M620 116h40M620 126h40M620 136h40" class="spool-line"/><rect x="616" y="150" width="48" height="10" rx="3" class="spool-cap"/></g>
        <path d="M640 128 C580 110 500 120 470 168 L440 300 L410 400" class="thread"/>
        <g class="fabric-run"><rect x="-200" y="452" width="1800" height="34" fill="url(#fab-floral)"/></g>
        <g clip-path="url(#sewclip)"><g class="fabric-run"><path d="M-200 469 H1600" class="stitch"/></g></g>
        <path d="M382 470 L432 470 L432 460 L396 460 Z" class="foot"/><path d="M420 404 V460" class="foot-bar"/>
        <g class="needle-bar"><rect x="398" y="392" width="14" height="40" rx="3" class="nb"/><path d="M405 432 V472" class="needle"/></g>
        <text class="note pop" x="600" y="640" text-anchor="middle" style="--d: 1.2s">stitch by stitch</text>
      </g>

      {# 6. the finished dress #}
      <g class="scene" data-scene="5">
        <rect width="1200" height="700" fill="#ECEAF1"/><rect width="1200" height="700" fill="url(#dots)"/>
        <path d="M600 600 L540 668 M600 600 L660 668 M600 600 V676" class="stand"/>
        <path d="M596 560 V604 H604 V560 Z" class="stand-pole"/>
        <circle cx="600" cy="114" r="14" class="form-knob"/><rect x="588" y="122" width="24" height="18" class="form-neck"/>
        {% set w = st.finished %}
        <g class="sway">
          <path d="{{ w.outline }}" fill="url(#fab-floral)" class="dress-fill"/>
          <path class="ln" d="{{ w.outline }}"/><path class="ln thin" d="{{ w.neck }}"/>
          {% for d in w.pockets %}<path class="ln thin dash" d="{{ d }}"/>{% endfor %}
        </g>
        {% for x, y, s in [(400, 180, 1), (812, 150,0.8), (360, 430,0.7), (850, 400, 1.1), (470, 600,0.6), (760, 600,0.7)] %}
        <g transform="translate({{ x }} {{ y }}) scale({{ s }})"><path class="spark pop" d="M0 -22 C3 -4 4 -3 22 0 C4 3 3 4 0 22 C-3 4 -4 3 -22 0 C-4 -3 -3 -4 0 -22 Z" style="--d: {{ 0.8 + loop.index0 * 0.2 }}s"/></g>
        {% endfor %}
        <g class="endcard" style="--d: 3.8s">
          <rect x="350" y="222" width="500" height="262" rx="30" fill="#fff" filter="url(#soft)"/>
          <image href="{{ u('static/logo.svg') }}" x="440" y="250" width="320" height="112"/>
          <text x="600" y="430" text-anchor="middle" class="end-t">made by you</text>
        </g>
      </g>
    </svg>
    <button type="button" class="film-play" data-film-big aria-label="Play the film"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
  </div>
  <div class="film-bar">
    <button type="button" class="round-btn" data-film-toggle aria-label="Play" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5l11 7-11 7z"/><path class="i-pause" d="M9 6v12M15 6v12"/></svg>
    </button>
    <div class="film-segs" role="tablist" aria-label="Scenes">
      {% for s in st.scenes %}<button type="button" class="seg" role="tab" aria-selected="{{ 'true' if loop.first else 'false' }}" aria-label="Scene {{ loop.index }}: {{ s.title }}"><span class="seg-fill"></span></button>{% endfor %}
    </div>
    <button type="button" class="round-btn" data-film-restart aria-label="Watch from the start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.3M4 4v5h5"/></svg></button>
  </div>
  <div class="film-cap" aria-live="polite">
    <p class="brand-label" data-film-count>Scene 1 of {{ st.scenes|length }}</p>
    <h3 id="film-title" data-film-title>{{ st.scenes[0].title }}</h3>
    <p id="film-text" data-film-text>{{ st.scenes[0].text }}</p>
  </div>
  <script type="application/json" id="film-scenes">{{ st.scenes | tojson }}</script>
</div>
